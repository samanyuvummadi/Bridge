<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bridge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="apple-touch-icon" href="/logo192.png">
    <meta name="theme-color" content="#1B5E20" />
    <title>Bridge — Find the benefits you've earned</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bb-bg: #FBF7F0;
        --bb-surface: #FFFFFF;
        --bb-text: #1A2419;
        --bb-text-soft: #5A6B58;
        --bb-green: #1B5E20;
        --bb-green-soft: #E8F1E8;
        --bb-amber: #C77E1F;
        --bb-amber-soft: #FBEFD8;
        --bb-border: #E4DFD2;
        --bb-danger: #B22222;
        --bb-radius: 14px;
        --bb-shadow: 0 4px 20px rgba(28, 49, 27, 0.06);
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        background: var(--bb-bg);
        color: var(--bb-text);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      h1, h2, h3 {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        margin: 0 0 0.4em;
        letter-spacing: -0.01em;
        line-height: 1.15;
      }
      h1 { font-size: 2.4rem; }
      h2 { font-size: 1.7rem; }
      h3 { font-size: 1.25rem; }
      button {
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
      }
      input, select, textarea {
        font-family: inherit;
        font-size: 1rem;
        color: var(--bb-text);
      }
      input:focus, button:focus, select:focus {
        outline: 2px solid var(--bb-green);
        outline-offset: 2px;
      }
      a { color: var(--bb-green); }

      /* Layout */
      .bb-app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        /* iPhone notch / dynamic island safe area */
        padding-top: max(48px, env(safe-area-inset-top));
      }
      .bb-header {
        padding: 18px 22px;
        background: var(--bb-surface);
        border-bottom: 1px solid var(--bb-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .bb-brand {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 1.5rem;
        color: var(--bb-green);
      }
      .bb-container {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }

      /* Buttons */
      .bb-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 22px;
        border: none;
        border-radius: var(--bb-radius);
        font-weight: 600;
        background: var(--bb-green);
        color: white;
        transition: filter 0.15s ease, transform 0.05s ease;
      }
      .bb-btn:hover { filter: brightness(0.95); }
      .bb-btn:active { transform: scale(0.99); }
      .bb-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
      .bb-btn-secondary {
        background: var(--bb-surface);
        color: var(--bb-green);
        border: 1.5px solid var(--bb-green);
      }
      .bb-btn-ghost {
        background: transparent;
        color: var(--bb-text-soft);
        border: 1.5px solid var(--bb-border);
      }
      .bb-btn-block { width: 100%; }
      .bb-btn-sm {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 0.92rem;
      }

      /* Inputs */
      .bb-field { margin-bottom: 18px; }
      .bb-label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--bb-text);
      }
      .bb-help {
        display: block;
        font-size: 0.85rem;
        color: var(--bb-text-soft);
        margin-bottom: 8px;
      }
      .bb-input {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid var(--bb-border);
        border-radius: var(--bb-radius);
        background: var(--bb-surface);
      }
      .bb-row { display: flex; gap: 12px; }
      .bb-row > * { flex: 1; }

      /* Card */
      .bb-card {
        background: var(--bb-surface);
        border: 1px solid var(--bb-border);
        border-radius: var(--bb-radius);
        padding: 20px;
        box-shadow: var(--bb-shadow);
        margin-bottom: 16px;
      }

      /* Guided discovery selection cards */
      .bb-select-grid { display: grid; gap: 10px; }
      .bb-select-card {
        width: 100%;
        text-align: left;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 14px;
        border-radius: 12px;
        border: 1.5px solid var(--bb-border);
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .bb-select-card:hover { background: rgba(27,67,50,0.04); }
      .bb-select-card-selected { border: 2px solid #1B4332; background: rgba(27,67,50,0.05); }
      .bb-select-card-icon { color: #1B4332; margin-top: 1px; }
      .bb-select-card-title { font-weight: 800; }
      .bb-select-card-desc { color: var(--bb-text-soft); font-size: 0.92rem; margin-top: 2px; }

      /* Progress */
      .bb-progress-track {
        height: 6px;
        background: var(--bb-border);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .bb-progress-fill {
        height: 100%;
        background: var(--bb-green);
        transition: width 0.3s ease;
      }
      .bb-progress-label {
        font-size: 0.85rem;
        color: var(--bb-text-soft);
      }

      /* Confidence pills */
      .bb-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 999px;
        letter-spacing: 0.05em;
      }
      .bb-pill-high { background: var(--bb-green-soft); color: var(--bb-green); }
      .bb-pill-medium { background: var(--bb-amber-soft); color: var(--bb-amber); }
      .bb-pill-low { background: #ECECE6; color: var(--bb-text-soft); }

      /* Mic */
      .bb-mic {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--bb-green-soft);
        color: var(--bb-green);
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }
      .bb-mic.bb-mic-listening {
        background: var(--bb-danger);
        color: white;
        animation: bb-pulse 1.1s infinite;
      }
      @keyframes bb-pulse {
        0% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0.55); }
        70% { box-shadow: 0 0 0 14px rgba(178, 34, 34, 0); }
        100% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0); }
      }

      /* Toast */
      .bb-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--bb-green);
        color: white;
        padding: 12px 18px;
        border-radius: var(--bb-radius);
        box-shadow: var(--bb-shadow);
        font-weight: 500;
        z-index: 100;
      }

      /* Tab bar */
      .bb-tabbar {
        position: relative;
        left: 0; right: 0;
        height: 56px;
        background: var(--bb-surface);
        border-top: 1px solid #eee;
        display: grid;
        grid-template-columns: 1fr 1fr;
        z-index: 10;
      }
      .bb-tabbar-top {
        border-top: none;
        border-bottom: 1px solid #eee;
      }
      .bb-tab {
        border: none;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--bb-text-soft);
        font-weight: 700;
        height: 56px;
        border-bottom: 3px solid transparent;
      }
      .bb-tab-active { color: var(--bb-green); border-bottom-color: var(--bb-green); }
      .bb-tab-icon { display: grid; place-items: center; line-height: 0; }
      .bb-tab-label { font-size: 0.8rem; }
      .bb-svg-icon { display: block; flex-shrink: 0; }

      /* Total saved hero */
      .bb-total-hero {
        background: #1B4332;
        border-radius: var(--bb-radius);
        padding: 18px 18px;
        color: rgba(255,255,255,0.92);
        box-shadow: var(--bb-shadow);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .bb-total-hero-kicker {
        font-weight: 800;
        letter-spacing: 0.14em;
        font-size: 1.25rem;
        color: rgba(255,255,255,0.72);
      }
      .bb-total-hero-amount {
        margin-top: 6px;
        font-family: "DM Serif Display", Georgia, serif;
        font-size: clamp(48px, 8vw, 72px);
        font-weight: 700;
        letter-spacing: -0.02em;
        position: relative;
        display: inline-block;
      }
      .bb-total-hero-amount-text { position: relative; z-index: 2; }
      .bb-total-hero-shimmer::after {
        content: "";
        position: absolute;
        inset: -6px -10px;
        background: linear-gradient(90deg, rgba(255,255,255,0.0), rgba(255,255,255,0.28), rgba(255,255,255,0.0));
        transform: translateX(-120%);
        animation: bb-shimmer 1.1s ease-in-out infinite;
        z-index: 1;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      @keyframes bb-shimmer {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(120%); }
      }
      .bb-total-hero-sub {
        margin-top: 4px;
        color: rgba(255,255,255,0.7);
        font-size: 1.2rem;
      }

      /* Renewal cards */
      .bb-renewal-card {
        background: var(--bb-surface);
        border: 1px solid var(--bb-border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .bb-renewal-card-critical {
        animation: bb-renewal-critical 1.3s infinite;
      }
      @keyframes bb-renewal-critical {
        0% { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        70% { box-shadow: 0 0 0 14px rgba(178, 34, 34, 0); }
        100% { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      }
      .bb-renewal-badge {
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.07em;
        padding: 4px 10px;
        border-radius: 999px;
        text-transform: uppercase;
        border: 1px solid transparent;
      }
      .bb-renewal-badge-safe { background: var(--bb-green-soft); color: var(--bb-green); border-color: rgba(27,94,32,0.18); }
      .bb-renewal-badge-soon { background: var(--bb-amber-soft); color: var(--bb-amber); border-color: rgba(199,126,31,0.18); }
      .bb-renewal-badge-urgent { background: rgba(210,105,30,0.12); color: #D2691E; border-color: rgba(210,105,30,0.2); }
      .bb-renewal-badge-critical { background: rgba(178,34,34,0.12); color: var(--bb-danger); border-color: rgba(178,34,34,0.2); }
      .bb-renewal-badge-expired { background: rgba(154,165,154,0.2); color: #566156; border-color: rgba(154,165,154,0.45); }
      .bb-renewal-track {
        height: 8px;
        background: #ECECE6;
        border-radius: 999px;
        overflow: hidden;
      }
      .bb-renewal-fill {
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
      }
      .bb-renewal-docs {
        margin-top: 12px;
        background: var(--bb-green-soft);
        border: 1px solid rgba(27,94,32,0.12);
        border-radius: 12px;
        padding: 12px 14px;
      }

      /* Timeline */
      .bb-timeline-item {
        border: 1px solid var(--bb-border);
        border-radius: 12px;
        overflow: hidden;
        background: white;
      }
      .bb-timeline-btn {
        width: 100%;
        text-align: left;
        padding: 14px 14px;
        background: transparent;
        border: none;
      }
      .bb-timeline-expanded {
        padding: 12px 14px 14px;
        border-top: 1px solid var(--bb-border);
        background: var(--bb-amber-soft);
      }

      /* Demo button */
      .bb-demo-btn {
        position: fixed;
        right: 14px;
        bottom: 68px;
        border: none;
        background: transparent;
        color: #808A80;
        font-size: 0.82rem;
        padding: 8px 10px;
        z-index: 70;
      }
      .bb-demo-btn:hover { color: var(--bb-text-soft); text-decoration: underline; }

      /* Card animations */
      @keyframes bb-rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .bb-rise { animation: bb-rise 0.35s ease both; }

      /* Disclaimer */
      .bb-disclaimer {
        margin-top: 30px;
        font-size: 0.8rem;
        color: var(--bb-text-soft);
        line-height: 1.5;
        font-style: italic;
      }

      /* Modal */
      .bb-modal-backdrop {
        position: fixed; inset: 0;
        background: rgba(20, 30, 19, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
      }
      .bb-modal {
        background: var(--bb-surface);
        border-radius: var(--bb-radius);
        max-width: 500px;
        width: 100%;
        padding: 24px;
        max-height: 90vh;
        overflow-y: auto;
      }

      /* Support modal quote block */
      .bb-support-quote {
        border: 1px solid rgba(27,67,50,0.18);
        background: rgba(27,67,50,0.05);
        border-radius: 14px;
        padding: 14px 14px;
        position: relative;
      }
      .bb-support-quote::before {
        content: "";
        position: absolute;
        left: 18px;
        top: -8px;
        width: 14px;
        height: 14px;
        background: rgba(27,67,50,0.05);
        border-left: 1px solid rgba(27,67,50,0.18);
        border-top: 1px solid rgba(27,67,50,0.18);
        transform: rotate(45deg);
      }
      .bb-support-quote-label {
        font-weight: 900;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(27,67,50,0.75);
        margin-bottom: 6px;
      }

      /* Results support FAB */
      .bb-support-fab {
        position: fixed;
        right: 18px;
        bottom: 18px;
        height: 52px;
        width: 52px;
        border-radius: 999px;
        border: none;
        background: #1B4332;
        color: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 0;
        overflow: hidden;
        transition: width 0.2s ease, filter 0.2s ease;
        z-index: 80;
        flex-direction: column;
      }
      .bb-support-fab-icon { display: grid; place-items: center; line-height: 0; }
      .bb-support-fab:hover { filter: brightness(1.03); width: 250px; justify-content: flex-start; flex-direction: row; padding: 0 16px; gap: 10px; }
      .bb-support-fab:focus-visible { width: 250px; justify-content: flex-start; flex-direction: row; padding: 0 16px; gap: 10px; }
      .bb-support-fab-label {
        white-space: nowrap;
        display: none;
        font-weight: 800;
      }
      .bb-support-fab:hover .bb-support-fab-label,
      .bb-support-fab:focus-visible .bb-support-fab-label {
        display: inline;
      }

      /* On touch devices (no hover), keep label visible */
      @media (hover: none) {
        .bb-support-fab { width: 250px; justify-content: flex-start; flex-direction: row; padding: 0 16px; }
        .bb-support-fab-label { display: inline; }
      }

      /* Prefilled value highlight */
      .bb-prefill-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      .bb-prefill-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--bb-border);
        font-size: 0.95rem;
      }
      .bb-prefill-table td.bb-prefill-key {
        color: var(--bb-text-soft);
        font-weight: 500;
        width: 45%;
      }
      .bb-prefill-table td.bb-prefill-val {
        background: var(--bb-amber-soft);
        color: var(--bb-text);
        font-weight: 600;
      }

      /* Document list */
      .bb-doc-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--bb-border);
        cursor: pointer;
      }
      .bb-doc-item input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--bb-green);
      }
      .bb-doc-item.bb-doc-checked .bb-doc-label {
        text-decoration: line-through;
        color: var(--bb-text-soft);
      }

      @media (max-width: 480px) {
        h1 { font-size: 1.9rem; }
        h2 { font-size: 1.4rem; }
        .bb-container { padding: 18px 16px 60px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
